# Trust Gate policy. Anything not listed here is denied (tools, arguments) or dropped (result fields).
#
# returns: an allowlist tree. `true` keeps a scalar field; a nested map keeps only the listed keys of
# an object (or of every object in a list). A field that is an object/list but marked `true` is dropped.
version: 1

shared:
  error: &error
    code: true
    message: true
    alternatives: { date: true, start: true, end: true }

  get_availability: &get_availability
    args: [date, service]
    returns:
      status: true
      date: true
      service: true
      slots: { start: true, end: true }
      error: *error

  prepare_booking: &prepare_booking
    args: [name, phone, service, date, time]
    returns:
      status: true
      confirmation_id: true
      expires_in_seconds: true
      readback: { name: true, service: true, date: true, time: true }
      readback_text: true
      error: *error

  book_appointment: &book_appointment
    args: [name, phone, service, date, time, confirmation_id, caller_confirmed]
    returns:
      status: true
      booking_id: true   # opaque random public id (bk_...), never the internal row id
      code: true
      service: true
      date: true
      start: true
      end: true
      error: *error

  get_faq: &get_faq
    args: [topic]
    returns:
      status: true
      topic: true
      answer: true
      error: *error

  # Both factors (booking code + last 4 phone digits) are checked in code; success switches the call to
  # the customer tier for THAT booking only. Returns only the caller's own booking, never name or phone.
  verify_booking: &verify_booking
    args: [code, phone_last4]
    returns:
      status: true
      booking: { code: true, service: true, date: true, start: true, end: true, status: true }
      error: *error

tiers:
  public:
    channels: [voice, text]
    tools:
      get_availability: *get_availability
      prepare_booking: *prepare_booking
      book_appointment: *book_appointment
      get_faq: *get_faq
      verify_booking: *verify_booking

  customer:
    channels: [voice, text]
    tools:
      get_availability: *get_availability
      prepare_booking: *prepare_booking
      book_appointment: *book_appointment
      get_faq: *get_faq
      verify_booking: *verify_booking
      # Two-step: first call returns a read-back + confirmation_id, second call (after a spoken yes) writes.
      reschedule:
        args: [code, phone_last4, new_date, new_time, confirmation_id, caller_confirmed]
        require: [own_booking]
        returns:
          status: true
          confirmation_id: true
          expires_in_seconds: true
          readback_text: true
          code: true
          service: true
          date: true
          start: true
          end: true
          error: *error
      cancel:
        args: [code, phone_last4, confirmation_id, caller_confirmed]
        require: [own_booking]
        returns:
          status: true
          confirmation_id: true
          expires_in_seconds: true
          readback_text: true
          code: true
          error: *error

  # The owner never talks to the agent: owner tools exist only on the dashboard channel (behind login).
  # Read-only. Even the owner never receives internal row ids or phone digits (half of a customer credential).
  # audit: false = successful reads are not logged (the dashboard polls); denied attempts are always logged.
  owner:
    channels: [dashboard]
    tools:
      list_bookings:
        args: [date, status]
        audit: false
        returns:
          status: true
          bookings: { booking_id: true, code: true, customer: true, service: true, start: true, end: true, status: true }
          error: *error
      list_events:
        args: [limit]
        audit: false
        returns:
          status: true
          events: { ts: true, tier: true, tool: true, blocked: true, reason: true }
      get_availability:
        args: [date, service]
        audit: false
        returns:
          status: true
          date: true
          service: true
          slots: { start: true, end: true }
          error: *error
      get_metrics:
        args: []
        audit: false
        returns:
          status: true
          available: true
          ts: true
          mode: true
          measured_with: true
          redteam:
            attacks: true
            measured_with: true
            baseline: { succeeded: true, leaks: true, unauthorized_writes: true, forbidden_successes: true, context_exposures: true, blocked_calls: true, errors: true }
            voicegate: { succeeded: true, leaks: true, unauthorized_writes: true, forbidden_successes: true, context_exposures: true, blocked_calls: true, errors: true }
            rows: { id: true, category: true, baseline: true, voicegate: true }
          booking: { cases: true, outcome_correct: true, double_bookings: true, false_confirmations: true, errors: true, measured_with: true, failures: { id: true, desc: true } }
          codemix: &codemix_metrics
            total: true
            correct: true
            accuracy: true
            measured_with: true
            by_lang: { tenglish: true, hinglish: true, english: true }
            failures: { id: true, text: true }
          codemix_heldout: *codemix_metrics
