# Code-mixed slot extraction set (English / Tenglish / Hinglish), written BEFORE the normalizer existed
# (see git history) so the normalizer is not tuned to it after the fact.
#
# Reference "now": Monday 2 Nov 2026, 08:00 (eval/synthetic.py EVAL_NOW).
#   today = 2026-11-02 (Mon), tomorrow = 2026-11-03 (Tue), day after = 2026-11-04 (Wed)
# expected: date (YYYY-MM-DD or null), time (HH:MM or null), service (key or null).
# issue: optional flag the normalizer must raise (past_date, invalid_date, invalid_time, needs_hour, ambiguous_time).
# Times are what the caller MEANT, even if the clinic would reject them later (e.g. 22:00, 11:15).
# Limitation: these are typed transcripts. Real accuracy also depends on speech recognition.

reference_now: "2026-11-02T08:00:00"

